name: vitap

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

x-database-environment: &database-environment
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-vitap}
  POSTGRES_USER: ${POSTGRES_USER:-vitap}
  # Tách các thành phần để mật khẩu chứa @, :, / được URL-encode đúng.
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitap}
      POSTGRES_USER: ${POSTGRES_USER:-vitap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH_PORT:-5432}:5432"

  backend-init:
    build: *backend-build
    environment: *database-environment
    command: ["sh", "-ec", "alembic upgrade head && python -m data_seed.seed_m3_fixture"]
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: *backend-build
    environment:
      <<: *database-environment
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      USE_MOCK_AI: ${USE_MOCK_AI:-true}
      OCR_MODE: ${OCR_MODE:-printed}
      OCR_LANG: ${OCR_LANG:-vi}
      OCR_PADDLE_DEVICE: ${OCR_PADDLE_DEVICE:-cpu}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-180}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.8-flash}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      RERANKER_URL: ${RERANKER_URL:-}
      KAGGLE_MEDGEMMA_NGROK_URL: ${KAGGLE_MEDGEMMA_NGROK_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
    volumes:
      - private_storage:/app/storage
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      backend-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  worker:
    profiles: [worker]
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "app.workers.runner"]
    environment:
      <<: *database-environment
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      STORAGE_ROOT: /app/storage
      USE_MOCK_AI: ${USE_MOCK_AI:-true}
      OCR_MODE: ${OCR_MODE:-printed}
      OCR_LANG: ${OCR_LANG:-vi}
      OCR_PADDLE_DEVICE: ${OCR_PADDLE_DEVICE:-cpu}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-180}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-3.8-flash}
    volumes:
      - private_storage:/app/storage
      - paddlex_cache:/home/appuser/.paddlex
    depends_on:
      backend-init:
        condition: service_completed_successfully

volumes:
  private_storage:
  postgres_data:
  paddlex_cache:
