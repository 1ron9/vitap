name: vitap

services:
  db:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitap}
      POSTGRES_USER: ${POSTGRES_USER:-vitap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Tách các thành phần để mật khẩu chứa @, :, / được URL-encode đúng.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-vitap}
      POSTGRES_USER: ${POSTGRES_USER:-vitap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      USE_MOCK_AI: ${USE_MOCK_AI:-true}
    volumes:
      - private_storage:/app/storage
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.runner"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-vitap}
      POSTGRES_USER: ${POSTGRES_USER:-vitap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      STORAGE_ROOT: /app/storage
    volumes:
      - private_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  private_storage:
  postgres_data:
